name: Weekly PM Status Report

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (headless, for PDF conversion)
        run: sudo apt-get update && sudo apt-get install -y libreoffice --no-install-recommends

      - name: Generate status report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/main.py

      - name: Commit generated report
        run: |
          git config user.name "pm-report-bot"
          git config user.email "actions@github.com"
          git add reports/
          git diff --quiet --cached || git commit -m "chore: weekly PM status report [skip ci]"
          git push
